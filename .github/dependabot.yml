version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github_actions
      - auto-merge
    commit-message:
      prefix: chore
    cooldown:
      default-days: 7
    groups:
      # Fallback group for all minor/patch updates
      actions:
        update-types:
          - patch
          - minor
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: '/'
    versioning-strategy: increase
    schedule:
      interval: monthly
    labels:
      - dependencies
      - javascript
      - auto-merge
    commit-message:
      prefix: chore
    cooldown:
      default-days: 7
    groups:
      lint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - '@typescript-eslint/*'
      vitest:
        patterns:
          - 'vitest'
          - '@cloudflare/vitest-plugin'
      # Fallback groups for all other minor/patch updates
      production:
        dependency-type: production
        update-types:
          - patch
          - minor
      development:
        dependency-type: development
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: nodejs-latest-linker
